<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="punta" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="630" fill="#ffffff"/>

  <text x="500" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Flujo de trabajo: sentimiento entre nodos con fastText</text>

  <!-- Etiquetas de seccion -->
  <text x="516" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">Entrenamiento (una vez, fuera de linea)</text>
  <text x="520" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">Ejecucion (cada vez que se abre una obra)</text>

  <!-- Lexico (entrenamiento) -->
  <rect x="40" y="40" width="196" height="46" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="138" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">sentimientos_es.txt</text>
  <text x="138" y="76" text-anchor="middle" font-size="11" fill="#334155">lexico de polaridad (321 palabras)</text>

  <!-- Fila de entrenamiento -->
  <rect x="40" y="100" width="170" height="76" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="125" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">Obras/</text>
  <text x="125" y="148" text-anchor="middle" font-size="11" fill="#334155">25 archivos XML-TEI</text>

  <rect x="236" y="100" width="170" height="76" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="321" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">entrenarmodelo.exe</text>
  <text x="321" y="148" text-anchor="middle" font-size="11" fill="#334155">segmenta, etiqueta, balancea</text>

  <rect x="432" y="100" width="170" height="76" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="517" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">sentimientos_modelo.</text>
  <text x="517" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">train.txt</text>
  <text x="517" y="158" text-anchor="middle" font-size="11" fill="#334155">__label__ + texto</text>

  <rect x="628" y="100" width="170" height="76" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="713" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">fastText: train()</text>
  <text x="713" y="148" text-anchor="middle" font-size="11" fill="#334155">supervised - softmax - 5 epochs</text>

  <rect x="824" y="100" width="170" height="76" rx="10" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="909" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">sentimientos_modelo.ftz</text>
  <text x="909" y="148" text-anchor="middle" font-size="11" fill="#334155">cuantizado - ~50 MB</text>

  <!-- Flechas de entrenamiento -->
  <line x1="210" y1="138" x2="232" y2="138" stroke="#64748b" stroke-width="1.8" marker-end="url(#punta)"/>
  <line x1="406" y1="138" x2="428" y2="138" stroke="#64748b" stroke-width="1.8" marker-end="url(#punta)"/>
  <line x1="602" y1="138" x2="624" y2="138" stroke="#64748b" stroke-width="1.8" marker-end="url(#punta)"/>
  <line x1="798" y1="138" x2="820" y2="138" stroke="#64748b" stroke-width="1.8" marker-end="url(#punta)"/>
  <path d="M216,86 L216,138 L232,138" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#punta)"/>

  <!-- Modelo -> AnalizadorFastText -->
  <path d="M909,176 L909,226 L380,226 L380,324" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#punta)"/>

  <!-- Fila de entrada de la app -->
  <rect x="40" y="252" width="180" height="48" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="130" y="273" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">sentimientos_es.txt</text>
  <text x="130" y="290" text-anchor="middle" font-size="11" fill="#334155">recurso qrc de la app</text>

  <rect x="720" y="252" width="214" height="48" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="827" y="273" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Obra XML-TEI</text>
  <text x="827" y="290" text-anchor="middle" font-size="11" fill="#334155">abierta en la app</text>

  <path d="M130,300 L130,324" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#punta)"/>
  <path d="M827,300 L827,324" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#punta)"/>

  <!-- Fila de analizadores -->
  <rect x="40" y="330" width="200" height="76" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="140" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">AnalizadorLexico</text>
  <text x="140" y="378" text-anchor="middle" font-size="11" fill="#334155">puntaje por palabras del lexico</text>

  <rect x="280" y="330" width="200" height="76" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="380" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">AnalizadorFastText</text>
  <text x="380" y="378" text-anchor="middle" font-size="11" fill="#334155">loadModel(.ftz) + predictLine</text>

  <rect x="520" y="330" width="200" height="76" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="620" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">MainWindow</text>
  <text x="620" y="378" text-anchor="middle" font-size="11" fill="#334155">comboAnalizador elige el activo</text>

  <rect x="760" y="330" width="200" height="76" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="860" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">cargarSentimientos()</text>
  <text x="860" y="378" text-anchor="middle" font-size="11" fill="#334155">analiza unidades sp / p / l</text>

  <line x1="240" y1="368" x2="516" y2="368" stroke="#64748b" stroke-width="1.8" marker-end="url(#punta)"/>
  <line x1="480" y1="368" x2="516" y2="368" stroke="#64748b" stroke-width="1.8" marker-end="url(#punta)"/>
  <line x1="720" y1="368" x2="756" y2="368" stroke="#64748b" stroke-width="1.8" marker-end="url(#punta)"/>

  <!-- Fila del grafo -->
  <rect x="520" y="470" width="200" height="76" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="620" y="498" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Grafo::registrarSentimiento</text>
  <text x="620" y="518" text-anchor="middle" font-size="11" fill="#334155">promedio acumulado en la arista</text>

  <rect x="760" y="470" width="200" height="76" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="860" y="498" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">DialogoGrafo</text>
  <text x="860" y="518" text-anchor="middle" font-size="11" fill="#334155">aristas verdes (positivo) y rojas (negativo)</text>

  <path d="M860,406 L700,464" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#punta)"/>
  <line x1="720" y1="508" x2="756" y2="508" stroke="#64748b" stroke-width="1.8" marker-end="url(#punta)"/>

  <!-- Leyenda -->
  <rect x="40" y="590" width="16" height="16" rx="3" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="62" y="603" font-size="12" fill="#334155">Entrenamiento</text>
  <rect x="190" y="590" width="16" height="16" rx="3" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="212" y="603" font-size="12" fill="#334155">Datos / archivos</text>
  <rect x="360" y="590" width="16" height="16" rx="3" fill="#fde68a" stroke="#b45309"/>
  <text x="382" y="603" font-size="12" fill="#334155">Modelo .ftz</text>
  <rect x="500" y="590" width="16" height="16" rx="3" fill="#dcfce7" stroke="#15803d"/>
  <text x="522" y="603" font-size="12" fill="#334155">Ejecucion de la app</text>
</svg>
